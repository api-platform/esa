<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Mercure discovery</title>
  <script type="importmap">
    {
      "imports": {
        "eventsource": "https://esm.sh/eventsource@5.1.1",
        "@api-platform/mercure": "./mercure.js"
      }
    }
  </script>
</head>

<body>
  <p data-testid="author">…</p>
  <button data-testid="publish">Publish an update of the advertised type</button>

  <script type="module">
    import mercure from "@api-platform/mercure";

    const write = (author) => {
      document.querySelector('[data-testid="author"]').textContent = author.name
    }

    await mercure('/typed-authors/1', {onUpdate: write}).then((res) => res.json()).then(write)

    document.querySelector('[data-testid="publish"]').addEventListener('click', () => {
      fetch('/.well-known/mercure', {
        method: 'POST',
        body: new URLSearchParams({
          topic: '/typed-authors/1',
          type: 'author',
          data: JSON.stringify({'@id': '/typed-authors/1', name: 'Renamed'}),
        }).toString(),
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6ImF0K2p3dCJ9.eyJpc3MiOiJodHRwczovL2xvY2FsaG9zdCIsImF1ZCI6Imh0dHBzOi8vbG9jYWxob3N0Ly53ZWxsLWtub3duL21lcmN1cmUiLCJzdWIiOiJlc2EtdGVzdC1zZXJ2ZXIiLCJleHAiOjQxMDI0NDQ4MDAsImF1dGhvcml6YXRpb25fZGV0YWlscyI6W3sidHlwZSI6Imh0dHBzOi8vbWVyY3VyZS5yb2Nrcy9hdXRob3JpemF0aW9uLWRldGFpbCIsImFjdGlvbnMiOlsicHVibGlzaCJdLCJ0b3BpY3MiOlt7Im1hdGNoIjoiKiJ9XX1dfQ.hALEoYi-0uM3_5sbR7ikeGBw7yfQvSTKJNWS7JF575c'
        }
      })
    })
  </script>
</body>

</html>
